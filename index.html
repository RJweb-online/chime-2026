<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102c27">
  <title>CHIME 2026 — A little Christmas magic</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header><a class="wordmark" href="./" aria-label="CHIME 2026 home">CHIME<span>2026</span></a><span class="edition">A CHRISTMAS MUSIC ADVENT</span></header>
  <main>
    <p class="eyebrow">ONE LITTLE GIFT. A MOMENT OF WONDER.</p>
    <h1>Christmas, <em>unwrapped.</em></h1>
    <p class="intro">A song to slow down for. A little magic to take with you.</p>
    <div class="stage" id="stage">
      <div class="halo" aria-hidden="true"></div>
      <svg class="gift" viewBox="0 0 600 490" role="group" aria-labelledby="gift-title gift-desc">
        <title id="gift-title">A crimson Christmas present tied with a golden bow</title>
        <desc id="gift-desc">The ribbon unfolds and the lid lifts to reveal a Christmas song.</desc>
        <defs>
          <linearGradient id="paper" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#b43e44"/><stop offset=".43" stop-color="#94242f"/><stop offset="1" stop-color="#641923"/></linearGradient>
          <linearGradient id="lid" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#d05a59"/><stop offset=".25" stop-color="#a42e38"/><stop offset="1" stop-color="#7c202d"/></linearGradient>
          <linearGradient id="gold"><stop stop-color="#92703a"/><stop offset=".15" stop-color="#dbc18a"/><stop offset=".35" stop-color="#f9e6b1"/><stop offset=".54" stop-color="#c39a51"/><stop offset=".8" stop-color="#ead29a"/><stop offset="1" stop-color="#9d7738"/></linearGradient>
          <linearGradient id="loop" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#fff0bf"/><stop offset=".3" stop-color="#cba45e"/><stop offset=".52" stop-color="#8d602b"/><stop offset=".72" stop-color="#e6c98c"/><stop offset="1" stop-color="#fff0be"/></linearGradient>
          <radialGradient id="light"><stop stop-color="#ffedb1" stop-opacity=".9"/><stop offset=".35" stop-color="#efc976" stop-opacity=".28"/><stop offset="1" stop-color="#e5bb62" stop-opacity="0"/></radialGradient>
          <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 1H9 M1 0V9" stroke="#f5c1a1" stroke-opacity=".035" stroke-width=".6"/></pattern>
          <pattern id="stars" width="58" height="52" patternUnits="userSpaceOnUse"><path d="M12 12v6m-3-3h6 M40 38v4m-2-2h4" stroke="#e9bc80" stroke-width=".65" opacity=".25"/><circle cx="42" cy="12" r=".65" fill="#f1ca95" opacity=".3"/></pattern>
          <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020d0b" flood-opacity=".4"/></filter>
          <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
        </defs>
        <ellipse cx="300" cy="421" rx="156" ry="18" fill="#020e0c" opacity=".45" filter="url(#soft)"/>
        <g class="present">
          <path d="M173 259L195 243H411L432 259V399L411 414H194L173 399Z" fill="#511621"/>
          <path d="M187 260H417V389H187Z" fill="#291b16"/>
          <ellipse class="inner-light" cx="300" cy="260" rx="135" ry="100" fill="url(#light)"/>
          <g class="box-lid" filter="url(#shadow)">
            <path d="M163 244L185 223H416L438 244Z" fill="#c24e51"/>
            <path d="M163 244H438V274H163Z" fill="url(#lid)"/>
            <path d="M163 244H438" stroke="#ed9690" stroke-opacity=".6"/>
            <path d="M163 246H438V273H163Z" fill="url(#grain)"/>
            
          </g>
          <g class="song-card" filter="url(#shadow)">
            <rect x="197" y="233" width="207" height="181" rx="5" fill="#faf2df"/>
            <rect x="205" y="241" width="191" height="165" rx="2" fill="none" stroke="#c6aa71" stroke-width=".7"/>
            <path d="M289 259h23m-18-5 6 5-6 5m12-10-6 5 6 5" fill="none" stroke="#a8874a" stroke-width="1"/>
            <text x="300" y="283" class="card-kicker">A LITTLE CHRISTMAS CLASSIC</text>
            <text x="300" y="313" class="card-title">The Christmas Song</text>
            <text x="300" y="333" class="card-artist">Nat King Cole</text>
            <a id="song-link" href="https://www.youtube.com/watch?v=A8eWaR8ONvw" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-label="Play The Christmas Song by Nat King Cole on YouTube (opens a new tab)">
              <rect x="228" y="353" width="145" height="32" rx="16" fill="#21473b"/>
              <path d="M245 363l8 6-8 6Z" fill="#f8e9c6"/>
              <text x="309" y="373" class="card-play">PLAY ON YOUTUBE</text>
            </a>
          </g>
          <g class="box-body">
            <path d="M173 273H432V399L411 414H194L173 399Z" fill="url(#paper)"/>
            <path d="M173 273H432V399L411 414H194L173 399Z" fill="url(#grain)"/>
            <path d="M173 273H432V399L411 414H194L173 399Z" fill="url(#stars)"/>
            <path d="M432 273V399L411 414V285Z" fill="#4a1520" opacity=".3"/>
            <path d="M174 278H431" stroke="#5b1722" stroke-opacity=".45" stroke-width="3"/>
            <path d="M194 413H410" stroke="#d36e64" stroke-opacity=".2"/>
          </g>
          <g id="ribbon" aria-hidden="true"><g id="ribbon-front"></g><g id="ribbon-pull"></g><g id="ribbon-crossing"></g></g>
          <g class="sparkles" fill="#f7df9e"><path d="M221 182l2 7 7 2-7 2-2 7-2-7-7-2 7-2Z"/><path d="M388 205l2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/><path d="M338 146l1 5 5 1-5 2-1 5-2-5-5-2 5-1Z"/><circle cx="245" cy="150" r="1.8"/><circle cx="366" cy="172" r="1.5"/><circle cx="190" cy="235" r="1.4"/></g>
        </g>
      </svg>
      <button class="open-gift" id="open-gift" aria-label="Unwrap your Christmas song"><span>Click to unwrap <span aria-hidden="true">↗</span></span></button>
    </div>
    <div class="under-gift"><p id="status" role="status" aria-live="polite">A little Christmas magic awaits.</p><button id="replay" class="replay" disabled><span aria-hidden="true">↻</span> Wrap it up & replay</button></div>
  </main>
  <footer><span>A SMALL PREVIEW OF SOMETHING MAGICAL</span><span>Made for the season of listening.</span></footer>
</body>
</html>
